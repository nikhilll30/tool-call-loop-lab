# Tests only: offline, no secrets, read-only token.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt                 # fully pinned versions
      - run: python -m pytest -q                              # offline; expect 188 passed, 1 skipped
      - name: no-secrets-needed guard
        run: test -z "${OPENROUTER_API_KEY:-}"                # fails if anyone wires an API key into CI
