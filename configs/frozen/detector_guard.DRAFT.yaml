# DRAFT - NOT FROZEN. Tuned/inspected on DEV seeds only. Do not treat as final.
hard_stop_after_identical_cancelled: 3
id: guard-draft-0.1
max_calls_per_generation: 64
suite:
  adjacent:
    n: 3
  cross_turn:
    min_batch: 3
    min_similarity: 0.9
    min_streak: 2
    state_change_frac: 0.5
    use_state: false
    volatile_fields:
    - timestamp
    - ts
    - time
    - counter
    - nonce
    - request_id
    - seq
    - iteration
    - _t
  cycle:
    max_period: 128
    min_len: 8
    min_reps: 3
    state_change_frac: 0.5
    use_state: false
    volatile_fields:
    - timestamp
    - ts
    - time
    - counter
    - nonce
    - request_id
    - seq
    - iteration
    - _t
  distinct_ratio:
    max_norm_entropy: 0.5
    max_ratio: 0.4
    state_change_frac: 0.5
    use_state: false
    volatile_fields:
    - timestamp
    - ts
    - time
    - counter
    - nonce
    - request_id
    - seq
    - iteration
    - _t
    window: 96
  exact_dup:
    min_dups: 2
  id: draft-0.1
  near_dup:
    max_dist: 0.1
    min_repeats: 8
    state_change_frac: 0.5
    use_state: false
    volatile_fields:
    - timestamp
    - ts
    - time
    - counter
    - nonce
    - request_id
    - seq
    - iteration
    - _t
    window: 64
